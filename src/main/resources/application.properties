spring.application.name=usage-service
server.port=8083

# Spring Kafka Config
spring.kafka.bootstrap-servers=localhost:9094
spring.kafka.consumer.group-id=usage-service
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.type.mapping=energyUsageEvent:com.homeenergytracker.kafka.event.EnergyUsageEvent
spring.kafka.template.default-topic=energy-alerts
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# InfluxDB Config
influx.url=http://localhost:8072
influx.token=my-token
influx.org=spring-tutorial
influx.bucket=usage-bucket

device.service.url=http://localhost:8081/api/v1/devices
user.service.url=http://localhost:8080/api/v1/users